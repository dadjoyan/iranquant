name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests examples

      - name: Ruff format
        run: ruff format --check src tests examples

      - name: Mypy
        run: mypy src tests

      - name: Pytest (excluding live tests)
        run: pytest -m "not live"

      - name: Build distributions
        run: python -m build

      - name: Verify distribution contents
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              wheel_names = set(archive.namelist())

          required = {
              "iranquant/__init__.py",
              "iranquant/py.typed",
              "iranquant/core/__init__.py",
              "iranquant/models/__init__.py",
              "iranquant/market/__init__.py",
              "iranquant/codal/__init__.py",
              "iranquant/quant/__init__.py",
              "iranquant/stream/__init__.py",
          }
          missing = required - wheel_names
          assert not missing, f"wheel is missing: {sorted(missing)}"

          sdist = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(sdist) as archive:
              sdist_names = set(archive.getnames())

          forbidden = ("tests/", "__pycache__", ".venv/", "site/", ".DS_Store")
          for name in wheel_names | sdist_names:
              assert not any(token in name for token in forbidden), name

          print("distribution contents verified")
          PY

  publish:
    name: Publish to PyPI
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/iranquant/
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
