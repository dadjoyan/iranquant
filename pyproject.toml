[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iranquant"
version = "0.1.0"
description = "Async-first Python SDK and quantitative toolkit for TSETMC and Codal market data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Saeed Dadjoyan Aghdami", email = "Dadjoyans@gmail.com" },
]
keywords = [
    "tsetmc",
    "codal",
    "iran",
    "stock-market",
    "quant",
    "algotrading",
    "polars",
    "pandas",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Persian",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "tenacity>=8.2.0",
    "jdatetime>=5.0.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/dadjoyan/iranquant"
Repository = "https://github.com/dadjoyan/iranquant"
Documentation = "https://dadjoyan.github.io/iranquant/"
Changelog = "https://github.com/dadjoyan/iranquant/blob/main/CHANGELOG.md"
Issues = "https://github.com/dadjoyan/iranquant/issues"


[project.scripts]
iranquant = "iranquant.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "pymdown-extensions>=10.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iranquant"]

[tool.hatch.build.targets.wheel.force-include]
"src/iranquant/py.typed" = "iranquant/py.typed"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/iranquant",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: integration tests that hit live TSETMC/Codal servers",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["src", "tests"]
